{% extends "base.html" %}
{% block title %}대시보드 · TRMT3{% endblock %}

{% block head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  .fm-wrap{margin:-8px -4px 0}
  .fm-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .fm-bar h1{font-size:17px;margin:0;font-weight:700}
  .fm-legend{display:flex;gap:12px;font-size:11.5px;color:var(--text-secondary)}
  .fm-legend i{display:inline-block;width:9px;height:9px;border-radius:999px;margin-right:4px;vertical-align:middle}
  .fm-spacer{flex:1}.fm-updated{font-size:11px;color:var(--text-tertiary)}
  .fm-sup{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:8px}
  .fm-sup .lbl{font-size:11.5px;font-weight:700;color:var(--text-secondary)}
  .fm-search{border:1px solid var(--border);background:var(--surface);color:var(--text-primary);font-size:12.5px;padding:6px 12px;border-radius:999px;width:200px;outline:none}
  .fm-search:focus{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-bg)}
  .fm-sup button{border:1px solid var(--border);background:var(--surface);color:var(--text-secondary);font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px;cursor:pointer}
  .fm-sup button.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .fm-sup button .n{opacity:.7;font-weight:700;margin-left:3px}
  /* z-index:0 → Leaflet 내부 z-index(패널 200~700·컨트롤 1000)를 stage 안에 가둠.
     안 그러면 root로 새어나와 topnav 드롭다운(자동화 등) 위로 그려져 메뉴가 잘림. */
  .fm-stage{position:relative;z-index:0;height:calc(100vh - 200px);min-height:480px;border:1px solid var(--border-subtle);border-radius:14px;overflow:hidden}
  #fmmap{position:absolute;inset:0}.leaflet-container{background:#cfe0e6;font:inherit}
  .ship{position:relative;display:flex;align-items:center;justify-content:center;width:27px;height:27px;border-radius:50%;font-size:14px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
  .sire-flag{position:absolute;top:-4px;right:-4px;width:11px;height:11px;border-radius:50%;background:#eab308;border:1.5px solid #fff;animation:fmPulseY 1.3s infinite}
  @keyframes fmPulseY{0%{box-shadow:0 0 0 0 rgba(234,179,8,.85)}70%{box-shadow:0 0 0 9px rgba(234,179,8,0)}100%{box-shadow:0 0 0 0 rgba(234,179,8,0)}}
  .ship.red{background:var(--red,#c0392b)}.ship.amber{background:#b7791f}.ship.green{background:#3f7a4f}.ship.gray{background:#8a8175}
  /* Class/Flag 만기 임박(soon)·초과(overdue) 펄스 링 */
  .ship.due-overdue{border-color:#c0392b;animation:fmPulseR 1.1s infinite}
  .ship.due-soon{border-color:#e08a1e;animation:fmPulseA 1.6s infinite}
  @keyframes fmPulseR{0%{box-shadow:0 0 0 0 rgba(192,57,43,.75)}70%{box-shadow:0 0 0 11px rgba(192,57,43,0)}100%{box-shadow:0 0 0 0 rgba(192,57,43,0)}}
  @keyframes fmPulseA{0%{box-shadow:0 0 0 0 rgba(224,138,30,.7)}70%{box-shadow:0 0 0 10px rgba(224,138,30,0)}100%{box-shadow:0 0 0 0 rgba(224,138,30,0)}}
  .ship-label{font-size:10px;font-weight:700;color:var(--text-primary);background:rgba(251,248,242,.85);padding:1px 5px;border-radius:5px;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.12)}
  .port{width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--text-secondary)}
  .port-label{font-size:10px;color:var(--text-secondary);background:rgba(251,248,242,.8);padding:0 4px;border-radius:4px;white-space:nowrap}
  .fm-panel{position:absolute;top:0;right:0;width:360px;max-width:92%;height:100%;background:var(--surface);border-left:1px solid var(--border);box-shadow:-6px 0 24px rgba(0,0,0,.08);transform:translateX(100%);transition:transform .22s;z-index:1000;display:flex;flex-direction:column}
  .fm-panel.open{transform:translateX(0)}
  .fm-ph{padding:15px 18px;border-bottom:1px solid var(--border-subtle)}
  .fm-ph .row{display:flex;align-items:center;gap:8px}.fm-ph h2{margin:0;font-size:18px;font-weight:700}
  .fm-ph .sub{font-size:12px;color:var(--text-secondary);margin-top:3px}.fm-ph .badges{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .fm-x{margin-left:auto;border:0;background:transparent;font-size:20px;color:var(--text-tertiary);cursor:pointer}
  .fm-pb{padding:14px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:13px}
  .fm-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .fm-duewarn{display:block;text-decoration:none;padding:8px 11px;border-radius:9px;font-size:12.5px;font-weight:700}
  .fm-duewarn.overdue{background:var(--red-bg,#fbe4e1);color:var(--red,#c0392b);border:1px solid #f0b9b2}
  .fm-duewarn.soon{background:#fff3e0;color:#b7791f;border:1px solid #f0d2a0}
  .fm-alert{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:1200;max-width:88%;
    background:var(--surface);border:1px solid var(--border);border-radius:11px;box-shadow:0 5px 20px rgba(0,0,0,.13);
    padding:9px 36px 9px 13px;font-size:12.5px;line-height:1.55}
  .fm-al-row{white-space:normal}
  .fm-al-row+.fm-al-row{margin-top:4px;padding-top:4px;border-top:1px dashed var(--border-subtle)}
  .fm-al-row.crit{color:var(--red,#c0392b);font-weight:700}
  .fm-al-row.warn{color:#b7791f;font-weight:600}
  .fm-al-row small{color:var(--text-tertiary);font-weight:400}
  .fm-al-x{position:absolute;top:5px;right:8px;border:0;background:none;font-size:18px;line-height:1;cursor:pointer;color:var(--text-tertiary)}
  .fm-card{background:var(--surface-2);border:1px solid var(--border-subtle);border-radius:11px;padding:11px;display:block;text-decoration:none;color:inherit;transition:box-shadow .1s,transform .1s}
  a.fm-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.10);transform:translateY(-1px);border-color:var(--border)}
  a.fm-card .v::after{content:" ›";color:var(--text-tertiary);font-size:14px;font-weight:600}
  .fm-card .k{font-size:11.5px;color:var(--text-secondary);font-weight:600}.fm-card .v{font-size:25px;font-weight:700;line-height:1.1;margin-top:4px}
  .fm-card .v small{font-size:12px;color:var(--text-tertiary);font-weight:600}
  .fm-card.red .v{color:var(--red,#c0392b)}.fm-card.amber .v{color:#b7791f}.fm-card.blue .v{color:var(--blue)}.fm-card.green .v{color:#3f7a4f}
  .fm-sec{font-size:11.5px;font-weight:700;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.03em;margin-bottom:-4px}
  .fm-line{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--border-subtle)}.fm-line:last-child{border-bottom:0}
  .fm-line .lk{color:var(--text-secondary);flex:0 0 104px}.fm-line .lv{color:var(--text-primary);font-weight:600}
  .pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
  .pill.red{background:var(--red-bg,#fbe4e1);color:var(--red,#c0392b)}.pill.amber{background:#fff3e0;color:#b7791f}
  .pill.blue{background:var(--blue-bg);color:var(--blue)}.pill.green{background:#e4f0e6;color:#3f7a4f}
  .pill.gray{background:var(--surface-2);color:var(--text-secondary);border:1px solid var(--border-subtle)}
  .pill.lade{background:#3a3027;color:#f4efe6}.pill.ball{background:var(--blue-bg);color:var(--blue)}
  .fm-note{font-size:10.5px;color:var(--text-tertiary);font-style:italic}
  .fm-eta{font-size:11px;font-weight:600;color:var(--blue);background:var(--blue-bg);padding:2px 7px;border-radius:999px}
  .fm-btn{display:block;text-align:center;padding:10px;border-radius:9px;background:var(--blue);color:#fff;font-weight:700;font-size:13px;text-decoration:none;margin-top:2px}
  .fm-empty{padding:40px;text-align:center;color:var(--text-tertiary)}
</style>
{% endblock %}

{% block content %}
<div class="fm-wrap">
  <div class="fm-bar">
    <h1>🗺 Fleet Map</h1>
    <div class="fm-legend">
      <span><i style="background:#c0392b"></i>COC/Flag</span><span><i style="background:#b7791f"></i>Urgent</span>
      <span><i style="background:#3f7a4f"></i>이슈없음</span><span><i style="background:#8a8175"></i>일반이슈</span>
      <span title="Class/Flag 만기 임박·초과 선박은 마커가 펄스로 깜빡임">💢 펄스=Class/Flag 만기</span>
    </div>
    <div class="fm-spacer"></div>
    <a class="fm-updated" href="{{ url_for('dashboard_classic') }}" style="text-decoration:none">구 대시보드 →</a>
    <span class="fm-updated" id="fmUpdated">로딩…</span>
  </div>
  <div class="fm-sup" id="fmSup">
    <input id="fmSearch" class="fm-search" type="text" placeholder="🔍 선박명 검색…" autocomplete="off"/>
    <span class="lbl">감독 필터</span>
  </div>
  <div class="fm-stage">
    <div id="fmmap"></div>
    <div class="fm-alert" id="fmAlert" hidden></div>
    <div class="fm-panel" id="fmPanel">
      <div class="fm-ph"><div class="row"><div><h2 id="fmName">—</h2><div class="sub" id="fmSubt">—</div></div>
        <button class="fm-x" onclick="fmClose()">×</button></div><div class="badges" id="fmBadges"></div></div>
      <div class="fm-pb" id="fmBody"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  const esc=s=>(s==null?'':String(s)).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
  // 데이터 신선도 ALERT — 파이프라인 미갱신/선박별 noon 누락을 사이트 상단 배너로
  function renderAlert(s){
    const box=document.getElementById('fmAlert'); if(!box||!s) return;
    let html='';
    if(s.pipeline){
      const p=s.pipeline, age=p.days>=1?(p.days+'일'):(p.hours+'시간');
      html+='<div class="fm-al-row crit">⚠ <b>선위 데이터 미갱신</b> — '+esc(p.at)+' 이후 멈춤 (<b>'+age+'째</b>) · 맥 스케줄러 점검 필요</div>';
    }
    if(s.vessels&&s.vessels.length){
      const items=s.vessels.map(v=> v.since
        ? (esc(v.name)+' <small>'+esc(v.since)+'부터 '+v.days+'일</small>')
        : (esc(v.name)+' <small>보고 없음</small>')).join(' · ');
      html+='<div class="fm-al-row warn">📡 <b>noon 보고 누락 '+s.vessels.length+'척</b> — '+items+'</div>';
    }
    if(html){ box.innerHTML=html+'<button class="fm-al-x" title="닫기" onclick="this.parentNode.hidden=true">×</button>'; box.hidden=false; }
    else { box.hidden=true; }
  }
  // minZoom=2: 전세계(미국·남미 포함)가 최대 축소뷰. maxZoom=10. 줌은 스크롤로만.
  const map=L.map('fmmap',{zoomControl:true,worldCopyJump:true,minZoom:2,maxZoom:10,
    maxBounds:[[-82,-230],[90,230]],maxBoundsViscosity:0.6}).setView([20,140],2);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
    {attribution:'© CARTO © OSM',subdomains:'abcd',maxZoom:19}).addTo(map);
  let FLEET=[],markers=[],routeLayer=null,trackLayer=null,portMarkers=[],curSup='__all',fmQ='';
  function icon(v){
    const due=v.cls_due_state==='overdue'?' due-overdue':(v.cls_due_state==='soon'?' due-soon':'');
    const sire=v.sire_obs_overdue?'<span class="sire-flag" title="SIRE 검사일 +3주 초과 · Observation 미완료"></span>':'';
    // 선위소스 표시: 이메일모드=📡, AIS 끊김(이메일후보)=노란 경고점
    const pos=v.email_watch
      ? '<span title="이메일 선위 모드(AIS off 대응)" style="position:absolute;top:-7px;left:-7px;font-size:12px;line-height:1">📡</span>'
      : (v.ais_stale?'<span title="AIS 신호 끊김 — 이메일 선위 후보" style="position:absolute;top:-5px;left:-5px;width:10px;height:10px;border-radius:50%;background:#e0a800;border:1.5px solid #fff;box-shadow:0 0 0 1px #b7791f"></span>':'');
    return L.divIcon({className:'',iconSize:[27,27],iconAnchor:[13,13],html:'<div class="ship '+(v.color||'gray')+due+'" style="position:relative">🚢'+sire+pos+'</div>'});
  }

  fetch('{{ url_for("api_fleet_map_data") }}').then(r=>r.json()).then(d=>{
    FLEET=d.fleet||[];
    document.getElementById('fmUpdated').textContent= d.empty ? '데이터 없음 — 맥 스케줄러 첫 동기화 대기'
      : ('⟳ 온디맨드+맥 스케줄러 · 선위 '+(d.generated_at||'')+' · TRMT '+String(d.trmt_generated_at||'').slice(0,16));
    renderAlert(d.staleness);
    if(!FLEET.length){document.querySelector('.fm-stage').insertAdjacentHTML('beforeend','<div class="fm-empty">표시할 선박이 없습니다.</div>');return;}
    FLEET.forEach(v=>{
      const m=L.marker([v.lat,v.lng],{icon:icon(v)}).addTo(map);
      const tt=L.tooltip({permanent:true,direction:'top',offset:[0,-14],className:'ship-label'}).setContent(v.name).setLatLng([v.lat,v.lng]);tt.addTo(map);
      m.on('click',()=>openV(v));markers.push({v,m,tt});
    });
    const bar=document.getElementById('fmSup');
    const mk=(label,key,cnt,on)=>{const b=document.createElement('button');b.innerHTML=esc(label)+'<span class="n">'+cnt+'</span>';if(on)b.classList.add('on');b.onclick=()=>filt(key,b);bar.appendChild(b);return b;};
    mk('전체','__all',FLEET.length,true);
    (d.supervisors||[]).forEach(s=>mk(s,s,FLEET.filter(v=>v.supervisor===s).length,false));
    // 선명 검색: 입력하면 일치 선박만 표시, 단일 일치면 그쪽으로 이동(줌 유지)
    const si=document.getElementById('fmSearch');
    if(si){
      si.addEventListener('input',()=>{ fmQ=si.value.trim().toLowerCase(); const vis=applyFilters();
        if(fmQ && vis.length===1){ map.panTo([vis[0].v.lat,vis[0].v.lng]); } });
      si.addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ const vis=applyFilters();
        if(vis.length){ map.panTo([vis[0].v.lat,vis[0].v.lng]); openV(vis[0].v); } } });
    }
  }).catch(()=>{document.getElementById('fmUpdated').textContent='데이터 로드 실패';});

  // 감독필터 + 선명검색 동시 적용. 보이는 마커 배열 반환.
  function applyFilters(){
    const vis=[];
    markers.forEach(o=>{
      const supOK = curSup==='__all' || o.v.supervisor===curSup;
      const qOK = !fmQ || (o.v.name||'').toLowerCase().includes(fmQ);
      const show = supOK && qOK;
      if(show){o.m.addTo(map);o.tt.addTo(map);vis.push(o);}else{map.removeLayer(o.m);map.removeLayer(o.tt);}
    });
    return vis;
  }
  function filt(key,btn){
    curSup=key;
    document.querySelectorAll('#fmSup button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');
    applyFilters();fmClose();
  }
  // 선위 소스 라벨: 이메일 override > AIS(vesseltracker) > SVMS noon. 끊김 경고 포함.
  function posSrcLabel(v){
    if(v.pos_source==='email')
      return '<span style="color:#b7791f">📡 위치=Master 이메일'+(v.pos_reported_at?' ('+esc(String(v.pos_reported_at).slice(0,16).replace("T"," "))+')':'')+'</span>';
    if(String(v.position_source||'').indexOf('AIS')>=0){
      const ts=v.position_ts?' ('+esc(String(v.position_ts).slice(0,16).replace("T"," "))+')':'';
      return '<span style="color:#2f6f9f">🛰 위치=AIS</span>'+ts+(v.ais_stale?' <span style="color:#b7791f">⚠ 신호 끊김</span>':'');
    }
    return '(SVMS noon)';
  }
  // AIS off 대응 토글: 켜면 그 배가 이메일 선위 watch 등록 → 워처가 Outlook 메일에서 선위 갱신
  function emailToggle(v){
    const on=!!v.email_watch;
    const warn=v.ais_stale?' <span style="color:#b7791f;font-size:11px">AIS 끊김 — 이메일 선위 권장</span>':'';
    return '<div class="fm-line"><span class="lk">🛰️ AIS off → 이메일선위</span><span class="lv">'+
      '<button onclick="fmToggleEmail(\''+esc(v.name).replace(/'/g,"\\'")+'\','+(on?'false':'true')+')" '+
      'style="cursor:pointer;border:1px solid '+(on?'#b7791f':'var(--border)')+';background:'+(on?'#fef3c7':'var(--surface)')+
      ';color:'+(on?'#92400e':'var(--text)')+';border-radius:12px;padding:2px 10px;font-size:12px;font-weight:600">'+
      (on?'ON · 해제':'OFF · 켜기')+'</button>'+warn+'</span></div>';
  }
  window.fmToggleEmail=function(vessel,enable){
    fetch('{{ url_for("api_fleet_map_email_watch_set") }}',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({vessel:vessel,enabled:enable})})
      .then(r=>r.json()).then(res=>{
        if(!res.ok){alert('토글 실패: '+(res.error||''));return;}
        // 데이터 새로고침해서 마커/패널 반영
        location.reload();
      }).catch(()=>alert('토글 요청 실패'));
  };
  function openV(v){
    document.getElementById('fmName').textContent=v.name;
    document.getElementById('fmSubt').textContent=esc(v.cls||v.type||'')+' · 감독 '+esc(v.supervisor||'-')+' · '+v.lat.toFixed(1)+'°, '+v.lng.toFixed(1)+'°';
    const bl=v.bl==='L'?'lade':(v.bl==='B'?'ball':'gray');
    const blTxt=v.bl==='L'?'🛢 Laden':(v.bl==='B'?'💧 Ballast':'B/L —');
    document.getElementById('fmBadges').innerHTML='<span class="pill '+bl+'">'+blTxt+'</span>'+
      '<span class="pill '+(v.color==='green'?'green':v.color)+'">'+(v.color==='green'?'✓ 이슈없음':(v.coc?'COC/Flag':(v.urgent?'Urgent':'이슈')))+'</span>'+
      (v.status?'<span class="pill gray">'+esc(v.status)+'</span>':'');
    const vet=(v.vetting_open!=null)?'<span class="pill '+(v.vetting_open>2?'red':(v.vetting_open?'amber':'green'))+'">Open '+v.vetting_open+'</span>':'<span class="fm-note">미연동</span>';
    const cargo=v.cargo_op_applicable?('<div class="fm-sec">Cargo Operation (VLCC/LR · SVMS noon)</div><div class="fm-line"><span class="lk">상태</span><span class="lv">'+(v.cargo_op?esc(v.cargo_op):'<span class="fm-note">—</span>')+'</span></div>'):'';
    const ev=encodeURIComponent(v.name);
    // 4번째 카드: VLCC/LR=SIRE(Vetting), 그외=Condition Survey 총 open
    const isSire=v.cargo_op_applicable;
    const f4=isSire
      ? {href:'/vetting-status?vessel='+ev, k:'🛡 SIRE', val:(v.sire_open!=null?v.sire_open:'—'), unit:(v.sire_obs_overdue?' open · 3주↑':(v.sire_open!=null?' open':'')), cls:(v.sire_obs_overdue?'red':(v.sire_open?'amber':'green'))}
      : {href:'/condition-survey?vessel='+ev, k:'🔧 Cond.Survey', val:(v.cs_open!=null?v.cs_open:'—'), unit:' open', cls:(v.cs_open?'blue':'green')};
    const card=(href,cls,k,val,unit)=>'<a class="fm-card '+cls+'" href="'+href+'"><div class="k">'+k+'</div><div class="v">'+val+'<small>'+unit+'</small></div></a>';
    // Class/Flag 만기 경고 배너(overdue/임박)
    const dueLine = v.cls_due_state ? (
      '<a class="fm-duewarn '+v.cls_due_state+'" href="/class-status?vessel='+ev+'">⚠ Class/Flag 만기 '+
      (v.cls_due_state==='overdue' ? ('<b>'+Math.abs(v.cls_due_days)+'일 초과</b>') : ('<b>D-'+v.cls_due_days+'</b>'))+
      ' · '+esc(v.cls_due_date||'')+' ›</a>') : '';
    document.getElementById('fmBody').innerHTML=
      '<div class="fm-grid">'+
      card('/?vessel='+ev, v.issues_open?'red':'green', '📋 현재 이슈', v.issues_open, ' 건')+
      card('/class-status?vessel='+ev, v.coc?'red':'green', '⚓ COC/Flag', v.coc, ' 건')+
      card('/?vessel='+ev+'&priority='+encodeURIComponent('Urgent'), v.urgent?'amber':'green', '🚨 Urgent', v.urgent, ' 건')+
      card(f4.href, f4.cls, f4.k, f4.val, f4.unit)+
      '</div>'+
      dueLine+
      '<div class="fm-sec">운항 상태 '+posSrcLabel(v)+'</div>'+
      emailToggle(v)+
      '<div class="fm-line"><span class="lk">Ballast/Laden</span><span class="lv"><span class="pill '+bl+'">'+(v.bl==='L'?'Laden':(v.bl==='B'?'Ballast':'—'))+'</span></span></div>'+
      '<div class="fm-line"><span class="lk">상태/침로/속력</span><span class="lv">'+esc(v.status||'—')+' · '+(v.course!=null?v.course:'—')+'° · '+(v.speed!=null?v.speed:'—')+' kn</span></div>'+
      cargo+
      '<div class="fm-sec">Vetting</div><div class="fm-line"><span class="lk">현황</span><span class="lv">'+vet+'</span></div>'+
      '<div class="fm-line"><span class="lk">최근/Plan</span><span class="lv">'+esc(v.vetting_plan||'—')+'</span></div>'+
      '<div class="fm-sec">항로 (운항보고서 Schedule)</div>'+
      '<div class="fm-line"><span class="lk">In Port</span><span class="lv">'+esc((v.prev_port&&v.prev_port.name)||'—')+'</span></div>'+
      '<div class="fm-line"><span class="lk">Next Port</span><span class="lv">'+esc((v.next_port&&v.next_port.name)||'—')+(v.eta?' <span class="fm-eta">ETA '+esc(v.eta)+'</span>':'')+'</span></div>';
    document.getElementById('fmPanel').classList.add('open');drawRoute(v);
  }
  window.fmClose=function(){document.getElementById('fmPanel').classList.remove('open');clearRoute();};
  function portDot(xy,label){const pm=L.marker(xy,{icon:L.divIcon({className:'',html:'<div class="port"></div>',iconSize:[9,9],iconAnchor:[5,5]})}).addTo(map);
    const ptt=L.tooltip({permanent:true,direction:'bottom',offset:[0,4],className:'port-label'}).setContent(esc(label)).setLatLng(xy);ptt.addTo(map);portMarkers.push(pm,ptt);}
  function clearRoute(){[routeLayer,trackLayer].forEach(l=>l&&map.removeLayer(l));routeLayer=trackLayer=null;portMarkers.forEach(p=>map.removeLayer(p));portMarkers=[];if(window._fmA)clearInterval(window._fmA);}
  function drawRoute(v){
    clearRoute();const all=[[v.lat,v.lng]];
    // 회색 noon 항적(breadcrumb)은 표시 안 함 — noon 위치 튐으로 지저분. In→Next searoute만.
    if(v.prev_port&&v.prev_port.xy){portDot(v.prev_port.xy,(v.prev_port.name||'In Port')+' · 출항');all.push(v.prev_port.xy);}
    if(v.next_port&&v.next_port.xy){portDot(v.next_port.xy,(v.next_port.name||'Next Port')+' · 도착예정');all.push(v.next_port.xy);}
    const legs=(v.route_legs&&v.route_legs.length)?v.route_legs:[];
    if(legs.length){routeLayer=L.polyline(legs,{color:'#2f6f9f',weight:3,opacity:.9,dashArray:'2 9'}).addTo(map);
      let off=0;window._fmA=setInterval(()=>{off=(off-2)%22;routeLayer.setStyle({dashOffset:String(off)});},60);}
    // 클릭 시 자동 줌/이동 없음 — 줌은 스크롤로만 (손유석 요청)
  }
  setTimeout(()=>map.invalidateSize(),200);
})();
</script>
{% endblock %}
