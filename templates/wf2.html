{% extends "base.html" %}

{% block title %}WF2 회신 · TRMT3{% endblock %}

{% block head %}
<style>
  .wf2-head { display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .wf2-count { color:#64748b; font-size:13px; }
  .wf2-list { display:flex; flex-direction:column; gap:16px; max-width:1100px; }
  .wf2-card { border:1px solid #e2e8f0; border-radius:12px; background:#fff;
              box-shadow:0 1px 2px rgba(0,0,0,.04); overflow:hidden; }
  .wf2-card.is-busy { opacity:.55; pointer-events:none; }
  .wf2-top { display:flex; align-items:flex-start; gap:10px; padding:12px 14px;
             background:#f8fafc; border-bottom:1px solid #eef2f7; }
  .wf2-subj { font-weight:600; color:#0f172a; line-height:1.35; }
  .wf2-meta { font-size:12px; color:#64748b; margin-top:3px; }
  .wf2-badges { margin-left:auto; display:flex; gap:6px; flex-shrink:0; flex-wrap:wrap; justify-content:flex-end; }
  .wf2-badge { font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; }
  .b-proceed { background:#dbeafe; color:#1d4ed8; }
  .b-clarify { background:#fef3c7; color:#b45309; }
  .b-cat { background:#f1f5f9; color:#475569; }
  .b-lang { background:#ede9fe; color:#6d28d9; }
  .wf2-reason { font-size:12.5px; color:#475569; background:#fcfcfd; border-bottom:1px solid #eef2f7;
                padding:8px 14px; }
  .wf2-reason b { color:#334155; }
  .wf2-opts { display:flex; gap:12px; padding:14px; flex-wrap:wrap; }
  .wf2-opt { flex:1; min-width:300px; border:1px solid #e2e8f0; border-radius:10px; padding:10px;
             display:flex; flex-direction:column; gap:8px; }
  .wf2-opt.sel { border-color:#2563eb; box-shadow:0 0 0 2px #dbeafe; }
  .wf2-opt-h { display:flex; align-items:center; gap:8px; }
  .wf2-opt-tone { font-weight:700; font-size:13px; color:#0f172a; }
  .wf2-opt textarea { width:100%; border:1px solid #cbd5e1; border-radius:7px; padding:8px;
                      font-size:13px; font-family:inherit; line-height:1.55; min-height:130px; resize:vertical; }
  .wf2-ko { font-size:12.5px; color:#475569; background:#f8fafc; border-radius:7px; padding:8px;
            line-height:1.55; border:1px dashed #cbd5e1; }
  .wf2-ko-label { font-size:10.5px; font-weight:700; color:#94a3b8; text-transform:uppercase; letter-spacing:.04em; }
  .wf2-foot { display:flex; align-items:center; gap:8px; padding:10px 14px; border-top:1px solid #eef2f7;
              background:#fcfcfd; }
  .wf2-err { color:#b91c1c; font-size:13px; }
  .wf2-decided { font-size:12px; color:#64748b; }
  .wf2-empty { color:#94a3b8; padding:40px 0; text-align:center; }
  .flex-spacer { flex:1; }
</style>
{% endblock %}

{% block content %}
<h1 class="page-title">WF2 — 메일 회신 드래프트</h1>

<div class="wf2-head">
  <div class="wf2-filter" style="display:flex;gap:6px">
    <button class="btn btn-primary btn-sm" data-filter="pending" type="button">대기</button>
    <button class="btn btn-outline btn-sm" data-filter="selected" type="button">선택됨</button>
    <button class="btn btn-outline btn-sm" data-filter="all" type="button">전체</button>
  </div>
  <span class="wf2-count" id="wf2-count"></span>
  <span class="flex-spacer"></span>
  <button class="btn btn-primary btn-sm" id="wf2-pull" type="button" title="맥미니에 지금 메일 스캔·드래프트 작성을 요청 (수분 내 반영)">📥 메일 지금 풀링</button>
  <button class="btn btn-outline btn-sm" id="wf2-refresh" type="button">새로고침</button>
</div>

<div class="wf2-list" id="wf2-list"></div>
{% endblock %}

{% block scripts %}
<script>
(function () {
  const listEl = document.getElementById('wf2-list');
  const countEl = document.getElementById('wf2-count');
  let filter = 'pending';

  const esc = s => (s == null ? '' : String(s).replace(/[&<>"]/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])));

  async function load() {
    listEl.innerHTML = '<div class="wf2-empty">불러오는 중…</div>';
    let data;
    try {
      const r = await fetch('/api/wf2/replies?status=' + filter, {headers: {'Accept': 'application/json'}});
      data = await r.json();
    } catch (e) {
      listEl.innerHTML = '<div class="wf2-err" style="padding:20px">불러오기 실패: ' + esc(e.message) + '</div>';
      return;
    }
    countEl.textContent = '대기 ' + (data.pending || 0) + '건' +
      (filter !== 'pending' ? ' · 표시 ' + data.count + '건' : '');
    if (!data.replies.length) {
      listEl.innerHTML = '<div class="wf2-empty">' +
        (filter === 'pending' ? '대기 중인 회신안 없음 👍' : '항목 없음') + '</div>';
      return;
    }
    listEl.innerHTML = '';
    data.replies.forEach(d => listEl.appendChild(card(d)));
  }

  function card(d) {
    const el = document.createElement('div');
    el.className = 'wf2-card';
    el.dataset.id = d.id;
    const decided = !(d.status === 'pending' || d.status === 'selected');
    const intentBadge = d.intent === 'proceed'
      ? '<span class="wf2-badge b-proceed">진행지시</span>'
      : '<span class="wf2-badge b-clarify">추가질문</span>';
    const opts = Array.isArray(d.options) ? d.options : [];

    const reasonBox = `
      <div class="wf2-reason">
        <b>탐지</b>: ${esc(d.category || '?')}${d.stage ? ' · ' + esc(d.stage) : ''}
        · <b>의도</b>: ${d.intent === 'proceed' ? '진행지시' : '추가질문'}
        ${d.confidence != null ? ' · <b>conf</b> ' + d.confidence + '%' : ''}
        ${d.missing_fields ? ' · <b>빠진 정보</b>: ' + esc(d.missing_fields) : ''}
      </div>`;

    const optsHtml = opts.map((o, i) => {
      const isSel = d.selected_idx === i;
      const label = o.label || o.tone || ('옵션 ' + (i+1));
      const rec = (!decided) && ((d.intent === 'proceed' && /진행|승인/.test(label)) ||
                                 (d.intent === 'clarify' && /확인|질의/.test(label)));
      const koBlock = o.ko ? `
        <div class="wf2-ko"><div class="wf2-ko-label">한국어 번역 (확인용)</div>${esc(o.ko)}</div>` : '';
      const actions = decided ? '' : `
        <button class="btn btn-primary btn-sm act-select" data-idx="${i}" type="button">이 옵션 선택 → Outlook Draft</button>`;
      return `
        <div class="wf2-opt ${isSel ? 'sel' : ''}">
          <div class="wf2-opt-h"><span class="wf2-opt-tone">${esc(label)}</span>
            ${rec ? '<span class="wf2-badge b-proceed" title="코드 게이트 추천">추천</span>' : ''}
            ${isSel ? '<span class="wf2-badge b-proceed">선택됨</span>' : ''}</div>
          <textarea class="f-reply" data-idx="${i}" ${decided ? 'readonly' : ''}>${esc(o.reply || '')}</textarea>
          ${koBlock}
          ${actions}
        </div>`;
    }).join('');

    const summaryBox = d.summary_ko ? `
      <div class="wf2-reason" style="background:#eff6ff;border-color:#bfdbfe">
        <b>📨 수신메일 요약</b>: ${esc(d.summary_ko)}</div>` : '';

    el.innerHTML = `
      <div class="wf2-top">
        <div>
          <div class="wf2-subj">${esc(d.email_subject || '(제목 없음)')}</div>
          <div class="wf2-meta">${esc(d.email_from || '?')} · ${esc(d.email_date || '')} · #${d.id}</div>
        </div>
        <div class="wf2-badges">
          ${intentBadge}
          <span class="wf2-badge b-lang">${esc((d.lang || 'en').toUpperCase())}</span>
          ${d.category ? '<span class="wf2-badge b-cat">' + esc(d.category) + '</span>' : ''}
        </div>
      </div>
      ${summaryBox}
      ${reasonBox}
      <div class="wf2-opts">${optsHtml || '<div class="wf2-empty">옵션 없음</div>'}</div>
      <div class="wf2-foot">
        ${decided
          ? `<span class="wf2-decided">${esc(d.status)}${d.selected_idx != null ? ' · 옵션 ' + (d.selected_idx+1) : ''}` +
              `${d.decided_by ? ' · ' + esc(d.decided_by) : ''}${d.decided_at ? ' · ' + esc(d.decided_at) : ''}` +
              `${d.reject_reason ? ' · 사유: ' + esc(d.reject_reason) : ''}` +
              (d.status === 'draft_created' ? ' · ✉️ Outlook Draft 생성됨 — Outlook에서 최종 Send' : '') +
              (d.status === 'selected' ? ' · ⏳ 맥미니가 Draft 생성 대기' : '') + `</span>
            <span class="flex-spacer"></span>
            <button class="btn btn-outline btn-sm act-del" type="button">삭제</button>`
          : `<span class="wf2-err" hidden></span>
            <span class="flex-spacer"></span>
            <button class="btn btn-outline btn-sm act-reject" type="button">리젝</button>`}
      </div>`;

    if (!decided) {
      el.querySelectorAll('.act-select').forEach(b =>
        b.addEventListener('click', () => select(el, d, parseInt(b.dataset.idx, 10))));
      el.querySelector('.act-reject').addEventListener('click', () => reject(el, d));
    } else {
      const del = el.querySelector('.act-del');
      if (del) del.addEventListener('click', () => removeReply(el, d));
    }
    return el;
  }

  async function select(el, d, idx) {
    const errEl = el.querySelector('.wf2-err');
    if (errEl) errEl.hidden = true;
    const ta = el.querySelector('.f-reply[data-idx="' + idx + '"]');
    const edited = ta ? ta.value.trim() : '';
    if (!confirm('옵션 ' + (idx+1) + ' 선택 → 맥미니가 이 내용으로 Outlook 회신 Draft를 만듭니다.\n(자동발송 아님 — Outlook에서 직접 Send)')) return;
    el.classList.add('is-busy');
    try {
      const r = await fetch('/api/wf2/replies/' + d.id + '/select', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({idx, reply: edited})
      });
      const j = await r.json();
      if (!r.ok) {
        if (errEl) { errEl.textContent = '✕ ' + (j.error || '선택 실패'); errEl.hidden = false; }
        el.classList.remove('is-busy');
        return;
      }
      load();
    } catch (e) {
      if (errEl) { errEl.textContent = '✕ ' + e.message; errEl.hidden = false; }
      el.classList.remove('is-busy');
    }
  }

  async function reject(el, d) {
    const reason = prompt('리젝 사유 (선택):', '');
    if (reason === null) return;
    el.classList.add('is-busy');
    await fetch('/api/wf2/replies/' + d.id + '/reject', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({reason})
    });
    load();
  }

  async function removeReply(el, d) {
    if (!confirm('이 회신 기록을 삭제할까요?')) return;
    el.classList.add('is-busy');
    await fetch('/api/wf2/replies/' + d.id, {method: 'DELETE'});
    load();
  }

  document.querySelectorAll('[data-filter]').forEach(b =>
    b.addEventListener('click', () => {
      filter = b.dataset.filter;
      document.querySelectorAll('[data-filter]').forEach(x => {
        x.classList.toggle('btn-primary', x === b);
        x.classList.toggle('btn-outline', x !== b);
      });
      load();
    }));
  document.getElementById('wf2-refresh').addEventListener('click', load);
  document.getElementById('wf2-pull').addEventListener('click', async (e) => {
    const btn = e.currentTarget; const orig = btn.textContent;
    btn.disabled = true; btn.textContent = '요청 중…';
    try {
      const r = await fetch('/api/wf/pull-now', {method: 'POST', headers: {'Content-Type': 'application/json'}});
      if (r.ok) { btn.textContent = '✅ 요청됨 — 수분 내 반영'; }
      else { btn.textContent = '✕ 실패'; }
    } catch (_) { btn.textContent = '✕ 실패'; }
    setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 4000);
  });
  load();
})();
</script>
{% endblock %}
