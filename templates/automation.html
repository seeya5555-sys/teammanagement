{% extends "base.html" %}
{% block title %}자동화 모음 · TRMT3{% endblock %}
{% block head %}
<style>
  .au-wrap{max-width:920px}
  .au-master{display:flex;align-items:center;gap:12px;padding:12px 15px;border:1px solid var(--border);border-radius:12px;background:#fff;margin-bottom:16px}
  .au-master.off{background:var(--red-bg);border-color:var(--red-border)}
  .au-master b{font-size:14px}
  .au-master .au-sub{color:var(--text-secondary);font-size:12.5px}
  .au-ks{margin-left:auto;border:1px solid var(--border-strong);background:var(--surface-3);border-radius:8px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:13px}
  .au-ks.on{background:var(--green-bg);border-color:var(--green-border);color:var(--green)}
  .au-ks.off{background:var(--red-bg);border-color:var(--red-border);color:var(--red)}
  .au-sec{margin:18px 0 8px;font-size:13px;font-weight:700;color:var(--text-secondary);letter-spacing:.3px}
  .au-row{display:flex;align-items:center;gap:10px;padding:12px 15px;border:1px solid var(--border);border-radius:11px;background:#fff;margin-bottom:9px;flex-wrap:wrap}
  .au-name{font-weight:600;color:var(--text-primary);min-width:0}
  .au-name .au-desc{display:block;font-size:12px;color:var(--text-secondary);font-weight:400;margin-top:2px}
  .au-btns{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
  .au-b{border-radius:8px;padding:7px 13px;font-weight:700;font-size:12.5px;cursor:pointer;border:1px solid transparent;white-space:nowrap}
  .au-b.verify{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-border)}
  .au-b.live{background:var(--blue);color:#fff}
  .au-b.live.money{background:var(--amber)}
  .au-b.rjt{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-border)}
  .au-b.rjt2{background:var(--red);color:#fff}
  .au-b:disabled{opacity:.45;cursor:not-allowed}
  .au-status{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px}
  .st-queued{background:var(--amber-bg);color:var(--amber)}.st-running{background:var(--blue-bg);color:var(--blue)}
  .st-done{background:var(--green-bg);color:var(--green)}.st-failed{background:var(--red-bg);color:var(--red)}
  .au-log{margin-top:22px}
  .au-log-head{display:flex;align-items:center;gap:8px;cursor:pointer;padding:8px 4px;border-radius:8px;user-select:none}
  .au-log-head:hover{background:var(--surface-2)}
  .au-log-caret{font-size:12px;color:var(--text-secondary);transition:transform .12s;display:inline-block}
  .au-log-head.open .au-log-caret{transform:rotate(90deg)}
  .au-log h3{font-size:13px;font-weight:700;color:var(--text-secondary);margin:0}
  .au-log-meta{font-size:11.5px;color:var(--text-secondary);display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .au-log-clear{margin-left:auto;border:1px solid var(--red-border);background:var(--red-bg);color:var(--red);border-radius:8px;padding:5px 11px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
  .au-log-clear:disabled{opacity:.45;cursor:not-allowed}
  #au-runs{margin-top:8px}
  .au-log-cleared{font-size:11px;color:var(--text-tertiary);margin-top:6px;padding-left:4px}
  .au-logrow{border:1px solid var(--border-subtle);border-radius:9px;padding:9px 12px;margin-bottom:7px;background:#fff;font-size:12.5px}
  .au-logmeta{color:var(--text-secondary);font-size:11.5px;margin-bottom:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .au-logsum{white-space:pre-wrap;color:var(--text-primary);font-family:ui-monospace,Menlo,monospace;font-size:11.5px;max-height:170px;overflow:auto}
  .au-note{font-size:12px;color:var(--text-secondary);margin:4px 0 16px;line-height:1.5}
  /* 전자결재 검증 인라인 체크리스트 */
  .jl{max-width:920px;margin:2px 0 4px}
  .jl-head{display:flex;align-items:center;gap:8px;cursor:pointer;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);user-select:none;font-size:13px;font-weight:700;color:var(--text-secondary)}
  .jl-head:hover{background:var(--surface-3)}
  .jl-caret{font-size:12px;transition:transform .12s;display:inline-block;color:var(--text-tertiary)}
  .jl-head.open .jl-caret{transform:rotate(90deg)}
  .jl-headmeta{font-weight:400;font-size:11.5px;color:var(--text-tertiary);margin-left:auto;text-align:right}
  .jl-body{margin-top:8px}
  .jl-rev{font-size:11.5px;color:var(--text-tertiary);margin:2px 0 8px;line-height:1.5}
  .jl-grp{font-size:12px;font-weight:700;color:var(--text-secondary);margin:12px 0 5px}
  .jl-item{display:flex;align-items:center;gap:9px;padding:8px 12px;border:1px solid var(--border-subtle);border-radius:9px;background:#fff;margin-bottom:6px;font-size:12.5px;flex-wrap:wrap}
  .jl-item.excl{background:var(--amber-bg);border-color:var(--amber-border)}
  .jl-item.mis{background:var(--red-bg);border-color:var(--red-border)}
  .jl-item.mis .jl-why{color:var(--red)}
  .jl-item.human{background:var(--surface-2)}
  .jl-bkt.bkt-mis{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
  .jl-note{font-size:11px;color:var(--text-tertiary)}
  .jl-ref{font-weight:700;color:var(--text-primary);white-space:nowrap}
  .jl-sub{color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:60px;flex:1}
  .jl-amt{color:var(--text-tertiary);font-size:11.5px;white-space:nowrap}
  .jl-why{color:var(--amber);font-size:11.5px}
  .jl-bkt{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--surface-3);color:var(--text-secondary);white-space:nowrap}
  .jl-hold{font-size:10.5px;font-weight:700;color:var(--amber);background:var(--amber-bg);border:1px solid var(--amber-border);padding:1px 7px;border-radius:999px;white-space:nowrap}
  .jl-chk{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:11.5px;color:var(--text-secondary);white-space:nowrap;cursor:pointer;user-select:none}
  .jl-chk input{width:15px;height:15px;cursor:pointer;accent-color:var(--amber)}
  .jl-empty{font-size:12px;color:var(--text-tertiary);padding:6px 2px}
  .jl-pdf{border:1px solid var(--blue-border);background:var(--blue-bg);color:var(--blue);border-radius:7px;padding:3px 8px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
  .jpdf-modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:9000;align-items:center;justify-content:center;padding:24px}
  .jpdf-modal.open{display:flex}.jpdf-box{background:#fff;border-radius:12px;width:min(960px,96vw);height:min(90vh,1200px);display:flex;flex-direction:column;overflow:hidden}
  .jpdf-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface-2)}
  .jpdf-bar b{flex:1}.jpdf-bar a,.jpdf-bar button{font-size:12px;font-weight:700;border:1px solid var(--border);background:#fff;color:var(--text-secondary);border-radius:8px;padding:5px 10px;text-decoration:none;cursor:pointer}
  .jpdf-frame{flex:1;border:0;width:100%}
  .au-allrow{background:var(--surface-2);border-style:dashed}
  .soa-groups{margin:8px 0 20px}.soa-groups-head{display:flex;align-items:center;gap:8px;cursor:pointer;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);font-size:13px;font-weight:700;color:var(--text-secondary)}.soa-groups-head button{margin-left:auto}.soa-group-card{border:1px solid var(--border-subtle);border-radius:9px;background:#fff;padding:10px 12px;margin:7px 0;font-size:12.5px}.soa-group-meta{display:flex;gap:7px;flex-wrap:wrap;color:var(--text-secondary);font-size:11.5px;margin-top:5px}.soa-group-members{margin-top:7px;color:var(--text-primary);word-break:break-word}.soa-group-note{color:var(--text-tertiary);font-size:11.5px;margin-top:4px}.soa-edit{margin-left:auto;border:1px solid var(--border);background:#fff;border-radius:7px;padding:4px 9px;font-size:11px;font-weight:700;cursor:pointer}.soa-del{margin-left:0;color:var(--red);border-color:var(--red)}
  /* 그룹 편집 모달 — prompt() 연쇄 대신 한 화면에서 전부 편집 */
  .sgm{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:9100;align-items:center;justify-content:center;padding:20px}
  .sgm.open{display:flex}
  .sgm-box{background:#fff;border-radius:12px;width:min(680px,96vw);max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
  .sgm-bar{display:flex;align-items:center;gap:10px;padding:11px 15px;border-bottom:1px solid var(--border);background:var(--surface-2)}
  .sgm-bar b{flex:1;font-size:14px}
  .sgm-bar button{font-size:12px;font-weight:700;border:1px solid var(--border);background:#fff;color:var(--text-secondary);border-radius:8px;padding:5px 10px;cursor:pointer}
  .sgm-body{padding:14px 15px;overflow:auto;font-size:12.5px}
  .sgm-f{margin-bottom:13px}
  .sgm-f>label{display:block;font-weight:700;font-size:11.5px;color:var(--text-secondary);margin-bottom:5px}
  .sgm-f input[type=text],.sgm-f input[type=number],.sgm-f select{width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:13px;font-family:inherit;background:#fff;color:var(--text-primary)}
  .sgm-f input:disabled,.sgm-f select:disabled{background:var(--surface-2);color:var(--text-tertiary)}
  .sgm-row{display:flex;gap:10px}.sgm-row>div{flex:1}
  .sgm-radio{display:flex;gap:8px;flex-wrap:wrap}
  .sgm-radio label{flex:1;min-width:200px;display:flex;gap:7px;align-items:flex-start;border:1px solid var(--border);border-radius:9px;padding:8px 10px;cursor:pointer;font-size:12px;background:#fff}
  .sgm-radio label.on{border-color:var(--blue);background:var(--blue-bg)}
  .sgm-radio input{margin-top:2px}
  .sgm-radio i{display:block;font-style:normal;color:var(--text-tertiary);font-size:11px;margin-top:2px}
  .sgm-chips{display:flex;flex-wrap:wrap;gap:6px;border:1px solid var(--border);border-radius:9px;padding:9px;max-height:190px;overflow:auto;background:var(--surface-2)}
  .sgm-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);background:#fff;border-radius:20px;padding:4px 10px;font-size:12px;cursor:pointer;user-select:none}
  .sgm-chip.on{border-color:var(--blue);background:var(--blue-bg);color:var(--blue);font-weight:700}
  .sgm-chip.taken{opacity:.55}
  .sgm-chip.off-pool{border-style:dashed;border-color:var(--red);color:var(--red)}
  .sgm-chip input{display:none}
  .sgm-hint{color:var(--text-tertiary);font-size:11.5px;margin-top:5px;line-height:1.5}
  .sgm-warn{color:var(--red);font-size:11.5px;margin-top:6px;line-height:1.5;white-space:pre-line}
  .sgm-foot{display:flex;align-items:center;gap:10px;padding:11px 15px;border-top:1px solid var(--border);background:var(--surface-2)}
  .sgm-err{flex:1;color:var(--red);font-size:11.5px;white-space:pre-line}
  .sgm-save{border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:8px;padding:7px 16px;font-size:12.5px;font-weight:700;cursor:pointer}
  .sgm-save:disabled{opacity:.5;cursor:default}
  /* SOA 비용 수동 검토함 — 기존 자동화 카드/모달 토큰 그대로 */
  .sr{max-width:920px;margin:8px 0 18px}.sr-head{display:flex;align-items:center;gap:8px;cursor:pointer;padding:9px 12px;border:1px solid var(--amber-border);border-radius:10px;background:var(--amber-bg);font-size:13px;font-weight:700;color:var(--amber)}.sr-headmeta{margin-left:auto;font-size:11.5px;font-weight:500;color:var(--text-secondary)}.sr-body{margin-top:7px}.sr-case{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--border-subtle);border-radius:9px;background:#fff;margin-bottom:6px;cursor:pointer;font-size:12.5px;flex-wrap:wrap}.sr-case:hover{background:var(--surface-2)}.sr-case b{white-space:nowrap}.sr-sub{flex:1;min-width:120px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sr-badge{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px}.sr-red{background:var(--red-bg);color:var(--red)}.sr-amber{background:var(--amber-bg);color:var(--amber)}.sr-green{background:var(--green-bg);color:var(--green)}.sr-blue{background:var(--blue-bg);color:var(--blue)}.sr-empty{padding:9px 2px;color:var(--text-tertiary);font-size:12px}.srm{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:9200;align-items:center;justify-content:center;padding:18px}.srm.open{display:flex}.srm-box{width:min(860px,97vw);max-height:94vh;background:#fff;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}.srm-bar{display:flex;align-items:center;gap:8px;padding:11px 15px;border-bottom:1px solid var(--border);background:var(--surface-2)}.srm-bar b{flex:1}.srm-bar button{border:1px solid var(--border);background:#fff;border-radius:8px;padding:5px 9px;cursor:pointer}.srm-body{padding:13px 15px;overflow:auto}.srm-gate{padding:8px 10px;border-radius:8px;background:var(--amber-bg);color:var(--amber);font-size:11.5px;margin-bottom:9px}.srm-gate.ok{background:var(--green-bg);color:var(--green)}.srm-line{border:1px solid var(--border-subtle);border-radius:9px;padding:10px 11px;margin-bottom:8px}.srm-lh{display:flex;gap:8px;align-items:flex-start}.srm-lh b{font-size:12.5px}.srm-amt{margin-left:auto;font-weight:700;white-space:nowrap}.srm-reason{margin:7px 0;padding:6px 8px;border-radius:7px;background:var(--amber-bg);color:var(--amber);font-size:11.5px}.srm-facts{font-size:11.5px;color:var(--text-secondary);margin:6px 0}.srm-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.srm-btn{border:1px solid var(--border);background:#fff;border-radius:7px;padding:5px 8px;font-size:11.5px;font-weight:700;cursor:pointer}.srm-btn.on-confirm{background:var(--green);color:#fff;border-color:var(--green)}.srm-btn.on-reject{background:var(--red);color:#fff;border-color:var(--red)}.srm-rmk{flex:1;min-width:190px;border:1px solid var(--border);border-radius:7px;padding:5px 7px;font-size:11.5px}.srm-foot{display:flex;align-items:center;gap:7px;padding:10px 15px;border-top:1px solid var(--border);background:var(--surface-2)}.srm-msg{flex:1;font-size:11.5px;color:var(--red)}.srm-foot button{border-radius:8px;padding:7px 11px;font-size:11.5px;font-weight:700;cursor:pointer}.srm-save{border:1px solid var(--blue);background:var(--blue);color:#fff}.srm-push{border:1px solid var(--amber);background:var(--amber);color:#fff}.srm-approve{border:1px solid var(--green);background:var(--green);color:#fff}.srm-foot button:disabled{opacity:.4;cursor:not-allowed}@media(max-width:680px){.srm{padding:6px}.srm-box{max-height:98vh}.srm-lh{display:block}.srm-amt{display:block;margin:4px 0}.srm-rmk{flex-basis:100%}.srm-foot{flex-wrap:wrap}.srm-msg{flex-basis:100%}}
</style>
{% endblock %}
{% block content %}
<header class="page-header ops-page-header">
  <div><p class="ops-page-kicker">Operations</p><h1 class="page-title"><svg class="ic-svg"><use href="#i-workflow"/></svg> 자동화 모음</h1></div>
</header>
<div class="au-wrap">
  <div class="au-master" id="au-master">
    <div>
      <b>마스터 스위치</b>
      <span class="au-sub" id="au-master-sub">— 전체 자동화 on/off (킬스위치)</span>
    </div>
    <button class="au-ks" id="au-ks">…</button>
  </div>

  <div id="au-soa" class="jl"></div>
  <div id="soa-review" class="sr"></div>
  <div id="soa-groups" class="soa-groups"></div>

  <div class="au-sec">선박별 SOA 검증 (온디맨드)</div>
  <div id="au-vessel" style="max-width:920px">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2)">
      <input id="sv-vsl" placeholder="선박코드 (예: SVGW,SAPS)" autocomplete="off"
             style="text-transform:uppercase;width:190px;padding:6px 9px;border:1px solid var(--border);border-radius:8px;font-size:13px">
      <input id="sv-fm" placeholder="시작 YYYYMM" maxlength="6" inputmode="numeric"
             style="width:110px;padding:6px 9px;border:1px solid var(--border);border-radius:8px;font-size:13px">
      <input id="sv-to" placeholder="끝 YYYYMM" maxlength="6" inputmode="numeric"
             style="width:110px;padding:6px 9px;border:1px solid var(--border);border-radius:8px;font-size:13px">
      <select id="sv-tp" style="padding:6px 9px;border:1px solid var(--border);border-radius:8px;font-size:13px">
        <option value="05">Technical (05)</option><option value="04">Crew (04)</option></select>
      <select id="sv-review-model" title="SOA 검증 LLM 모델"
              style="padding:6px 9px;border:1px solid var(--border);border-radius:8px;font-size:13px">
        <option value="auto">Auto / 안전기본</option>
        <option value="claude-haiku-4-5">Haiku</option>
        <option value="openai/gpt-5.4-mini">GPT 5.4 mini (추가확인)</option>
      </select>
      <button class="au-b live" id="sv-live" type="button"> 검증 실기입</button>
      <button class="au-b verify" id="sv-remark" type="button" title="컨펌된 라인에 남은 리젝 리마크만 삭제 (승인·금액·상태 무변경)">리마크정리</button>
    </div>
  </div>

  <div class="au-sec">전자결재</div>
  <div id="au-jeonja"></div>
  <div id="au-jeonja-list" class="jl"></div>

  <div class="jpdf-modal" id="jpdf-modal">
    <div class="jpdf-box"><div class="jpdf-bar"><b id="jpdf-title">검토 인보이스</b><a id="jpdf-open" target="_blank" rel="noopener">새 탭</a><button id="jpdf-close" type="button">닫기 ✕</button></div><iframe class="jpdf-frame" id="jpdf-frame" title="전자결재 검토 인보이스 미리보기"></iframe></div>
  </div>

  <div class="srm" id="sr-modal">
    <div class="srm-box">
      <div class="srm-bar"><b id="sr-title">SOA 비용 검토</b><span id="sr-state"></span><button id="sr-close" type="button">닫기 ✕</button></div>
      <div class="srm-body" id="sr-detail"></div>
      <div class="srm-foot"><span class="srm-msg" id="sr-msg"></span><button id="sr-refresh" type="button">최신 SVMS 조회</button><button class="srm-save" id="sr-save" type="button">초안 저장</button><button class="srm-push" id="sr-push" type="button">SVMS 반영</button><button class="srm-approve" id="sr-approve" type="button">SOA 승인</button></div>
    </div>
  </div>

  <div class="sgm" id="sg-modal">
    <div class="sgm-box">
      <div class="sgm-bar"><b id="sg-title">그룹 편집</b><button id="sg-close" type="button">닫기 ✕</button></div>
      <div class="sgm-body" id="sg-body"></div>
      <div class="sgm-foot"><span class="sgm-err" id="sg-err"></span><button class="sgm-save" id="sg-save" type="button">저장</button></div>
    </div>
  </div>

  <div class="au-log">
    <div class="au-log-head" id="au-log-head">
      <span class="au-log-caret" id="au-log-caret">▸</span>
      <h3>실행 로그 (audit)</h3>
      <span class="au-log-meta" id="au-log-meta"></span>
      <button class="au-log-clear" id="au-log-clear" type="button" title="완료/실패 로그 비우기 (진행중은 보존)"><svg class="ic-svg" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> 비우기</button>
    </div>
    <div id="au-runs" hidden></div>
    <div class="au-log-cleared" id="au-log-cleared"></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
(function(){
  const SOA_SKIP=new Set(['soa_resend','soa_vessel','soa_review','soa_review_refresh','soa_review_push','soa_review_approve']);
  let TASKS={}, GROUPS=[], ENABLED=true, RUNS=[], TOTAL=0, CLEARED=null, LOG_OPEN=false;
  let GOPEN=false;

  function sgWarnings(){

    }
    await load();
    alert(`SOA 전체 ${lab}: ${ok}그룹 적재${busy_?` · ${busy_}그룹 이미대기/스위치off`:''}${fail?` · ${fail}그룹 실패`:''}\n(러너가 순차 실행 → 텔레그램 보고)`);
  }
  function openJpdf(ref){
    const url=`/api/automation/jeonja/items/${encodeURIComponent(ref)}/pdf`;
    $('#jpdf-title').textContent=`${ref} · 검토 인보이스`;
    $('#jpdf-frame').src=url; $('#jpdf-open').href=url; $('#jpdf-modal').classList.add('open');
  }
  function closeJpdf(){$('#jpdf-modal').classList.remove('open');$('#jpdf-frame').src='about:blank';}
  $('#jpdf-close').onclick=closeJpdf;
  $('#jpdf-modal').onclick=e=>{if(e.target.id==='jpdf-modal')closeJpdf();};
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeJpdf();});
  async function toggleExcl(ref,checked){
    JPENDING[ref]=checked?1:0;                // in-flight: 폴링 머지가 이 값을 덮어쓰지 않게
    const it=JLIST.find(x=>x.ref===ref); if(it) it.excluded=checked?1:0;
    JSIG=''; renderJeonja();                  // 낙관적 갱신
    const {ok,j}=await api('POST','/api/automation/jeonja/exclude',{ref,excluded:checked});
    delete JPENDING[ref];
    if(!ok){ alert((j&&j.error)||'변경 실패'); if(it) it.excluded=checked?0:1; JSIG=''; renderJeonja(); }
  }
  function renderLog(){
    const head=$('#au-log-head'), runsEl=$('#au-runs'), metaEl=$('#au-log-meta');
    head.classList.toggle('open',LOG_OPEN);
    $('#au-log-caret').textContent='▸';
    // 접힘 요약: N건 · 진행중 · 최근 실패
    const active=RUNS.filter(r=>r.status==='queued'||r.status==='running').length;
    const lastFail=RUNS.find(r=>r.status==='failed');
    let meta=`총 ${TOTAL}건`;
    if(active) meta+=` · <span style="color:#185FA5;font-weight:700">진행중 ${active}</span>`;
    if(lastFail) meta+=` · <span style="color:#A32D2D;font-weight:700">최근 실패 있음</span>`;
    metaEl.innerHTML=meta;
    // 펼침일 때만 리스트 DOM 렌더(비용↓)
    runsEl.hidden=!LOG_OPEN;
    if(LOG_OPEN){
      runsEl.querySelectorAll('.au-logrow[data-run-id]').forEach(row=>{
        const box=row.querySelector('.au-logsum');
        if(box&&row.dataset.runId) LOG_SCROLLS[row.dataset.runId]=box.scrollTop;
      });
      const html=RUNS.length?RUNS.map(fmt).join(''):'<div class="au-note">아직 실행 기록 없음.</div>';
      if(html!==LOG_SIG||!runsEl.innerHTML){
        runsEl.innerHTML=html;
        LOG_SIG=html;
      }
      const ids=new Set(RUNS.map(r=>String(r.run_id||'')));
      Object.keys(LOG_SCROLLS).forEach(k=>{ if(!ids.has(k)) delete LOG_SCROLLS[k]; });
      runsEl.querySelectorAll('.au-logrow[data-run-id]').forEach(row=>{
        const box=row.querySelector('.au-logsum'), y=LOG_SCROLLS[row.dataset.runId];
        if(box&&row.dataset.runId&&y!==undefined) box.scrollTop=y;
      });
    }
    $('#au-log-clear').disabled=!RUNS.some(r=>r.status==='done'||r.status==='failed');
    const cl=$('#au-log-cleared');
    cl.textContent=CLEARED?`마지막 비움: ${CLEARED.at} · ${CLEARED.by||'?'} · ${CLEARED.n}건 삭제`:'';
  }
  async function onRun(e){
    const btn=e.currentTarget||e.target;
    if(btn.dataset.all){ return runAllSoa(btn.dataset.all); }  // SOA 전체 한방에
    const task=btn.dataset.task, mode=btn.dataset.mode;
    if(!task||!mode){ console.warn('automation button missing task/mode', btn); return; }  // 스타일용 .au-b가 잘못 바인딩돼도 빈 task/mode POST 금지
    const nm=TASKS[task]||task;
    const confirmMsg={
      live: `[${nm}]\n자동 ${(task==='jeonja'||task==='fundreq')?'상신':'승인'}을 지금 실행할까요?\n(clean 건만 자동 처리, 예외는 미처리·텔레그램 보고)`,
      reject_mark: `[${nm}]\n금액 불일치(flag) 라인에 리젝 체크를 자동으로 답니다.\n(아직 제출·메일 안 함 — 체크만)`,
      reject_submit: `[${nm}]\n리젝 마킹된 SOA를 REJECTED로 제출하고 관리사에게 통보메일을 보냅니다.\n진행할까요?`,
      remark_cleanup: `[${nm}]\n컨펌(CFM_YN=Y)된 라인인데 리젝 리마크가 남아있는 것들의 리마크만 삭제합니다.\n(승인·금액·상태 무변경 — SVMS UI 버그 보정)`,
    }[mode];
    let cm=confirmMsg;
    if(mode==='live' && task==='jeonja'){   // 보류 반영 건수 명시(돈 안전)
      const sub=JLIST.filter(x=>x.bucket!=='already'), ex=sub.filter(x=>x.excluded).length;
      cm=`[전자결재 자동상신]\n상신대상 ${sub.length}건 중 보류 ${ex}건 제외 → ${sub.length-ex}건 상신.\n(불일치 기본보류·상신직전 STATUS 재확인)\n진행할까요?`;
    }
    if(cm && !confirm(cm))return;
    e.target.disabled=true;
    const {ok,j}=await api('POST','/api/automation/run',{task,mode});
    if(!ok){alert(j.error||'실행 실패');}
    await load();
  }
  async function toggleKs(){
    const {ok,j}=await api('POST','/api/automation/killswitch',{enabled:!ENABLED});
    if(ok){ENABLED=j.enabled;render();}
  }
  async function load(){const _sy=window.scrollY;try{return await _load();}finally{requestAnimationFrame(()=>window.scrollTo(0,_sy));}}
  async function _load(){
    const {ok,j}=await api('GET','/api/automation/runs');
    if(!ok)return;
    TASKS=j.tasks||{};ENABLED=j.enabled!==false;RUNS=j.runs||[];
    TOTAL=j.total||RUNS.length;CLEARED=j.cleared||null;
    const ji=await api('GET','/api/automation/jeonja/items');
    if(ji.ok){
      JLIST=ji.j.items||[]; JREV=ji.j.reviewed_at||null;
      for(const it of JLIST){ if(it.ref in JPENDING) it.excluded=JPENDING[it.ref]; }  // in-flight 토글 보존
    }
    await loadSoaReview();
    const sg=await api('GET','/api/automation/soa/groups');
    if(sg.ok){
      GROUPS=sg.j.groups||[]; OWNERS=sg.j.owners||{};
      if(sg.j.category_owner) CATOWNER=sg.j.category_owner;
      RESERVED=sg.j.reserved_keys||[];
    }
    render();
    renderGroups();
    // ⚠️ 모달이 열려 있으면 재렌더 안 함 — 7초 폴링이 입력 포커스/커서를 날려버림.
    //    경고는 열 때 기준으로 표시되고, 최종 판정은 저장 시 서버(422)가 함.
  }
  async function clearLog(){
    if(!confirm('완료/실패 실행 로그를 비웁니다.\n(진행중 작업은 보존됩니다)\n진행할까요?'))return;
    const {ok,j}=await api('DELETE','/api/automation/runs');
    if(ok){ alert(`로그 ${j.deleted}건 삭제됨`); await load(); }
    else { alert((j&&j.error)||'삭제 실패'); }
  }
  async function runVessel(mode){
    const codes=($('#sv-vsl').value||'').trim().toUpperCase().split(/[\s,;/]+/).filter(Boolean);
    const seen=new Set(), vessels=[];
    for(const c of codes){
      if(!/^[A-Z]{4}$/.test(c)){ alert('선박코드(4자 영문)를 정확히 입력하세요.'); return; }
      if(!seen.has(c)){ vessels.push(c); seen.add(c); }
    }
    if(!vessels.length){ alert('선박코드(4자 영문)를 정확히 입력하세요.'); return; }
    if(vessels.length>5){ alert('선박별 SOA 검증은 한 번에 최대 5척까지 실행합니다.'); return; }
    const fm=($('#sv-fm').value||'').trim(), to=($('#sv-to').value||'').trim(), sl=$('#sv-tp').value;
    const reviewModel=$('#sv-review-model').value||'auto';
    if((fm&&!/^\d{6}$/.test(fm))||(to&&!/^\d{6}$/.test(to))){ alert('기간은 YYYYMM 형식.'); return; }
    const params=vessels.length===1?{vsl_cd:vessels[0]}:{vsl_cds:vessels}; if(fm)params.fm_dm=fm; if(to)params.to_dm=to; if(sl)params.sl_tp=sl;
    params.review_model=reviewModel;
    const modelWarn = reviewModel==='openai/gpt-5.4-mini' ? '\n\nGPT 5.4 mini는 과플래그 가능성이 있어 결과 추가확인 전제로 실행합니다.' : '';
    const title=vessels.length===1?vessels[0]:`${vessels.join(', ')} (${vessels.length}척)`;
    if(mode==='remark_cleanup'){
      if(!confirm(`[선박별 리마크정리 — ${title}]\n컨펌(CFM_YN=Y)된 라인에 남아있는 리젝 리마크만 삭제합니다.\n(승인·금액·상태 무변경 · 승인완료(C) SOA는 서버가 막아 대상 아님)\n진행할까요?`)) return;
    } else if(mode==='live' && !confirm(`[선박별 SOA 검증 — ${title}]\n검증 실기입(CFM_YN 체크 + 금액불일치 RJT_YN 리마크)을 실행합니다.\n승인·출금·리젝제출·관리사메일은 안 합니다.${modelWarn}\n진행할까요?`)) return;
    const {ok,j}=await api('POST','/api/automation/run',{task:'soa_vessel',mode,params});
    if(!ok){ alert(j.error||'실행 실패'); return; }
    if(j.count>1){ alert(`선박별 SOA 검증 ${j.count}건을 큐에 넣었습니다.`); }
    await load();
  }
  $('#sr-close').onclick=()=>{$('#sr-modal').classList.remove('open');SRC=null;};
  $('#sr-modal').onclick=e=>{if(e.target.id==='sr-modal'){$('#sr-modal').classList.remove('open');SRC=null;}};
  $('#sr-save').onclick=saveSr; $('#sr-refresh').onclick=()=>srAction('refresh'); $('#sr-push').onclick=()=>srAction('push'); $('#sr-approve').onclick=()=>srAction('approve');
  $('#sv-live').onclick=()=>runVessel('live');
  $('#sv-remark').onclick=()=>runVessel('remark_cleanup');
  $('#au-ks').onclick=toggleKs;
  $('#au-log-head').onclick=(e)=>{ if(e.target.closest('#au-log-clear'))return; LOG_OPEN=!LOG_OPEN; renderLog(); };
  $('#au-log-clear').onclick=(e)=>{ e.stopPropagation(); clearLog(); };
  load();
  setInterval(load,7000);  // 상태/로그 자동 갱신
})();
</script>
{% endblock %}
